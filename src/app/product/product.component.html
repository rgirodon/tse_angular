@if (product.id != 0) {
    <h2>Product</h2>
    <p>
        {{ product.name }} - {{ product.price }}&euro; 
        @if (product.discount) {
            <em> &#9888; -{{ product.discount }}% &#9888; </em>
        }
        <button (click)="addToCart()">Add to cart</button> 
    </p>
    <p>
        <a routerLink="" routerLinkActive="active" ariaCurrentWhenActive="page">Back to list</a> 
    </p>
}
